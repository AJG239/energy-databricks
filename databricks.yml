# This is a Declarative Automation Bundle definition for energy_databricks.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: energy_databricks
  uuid: 612d34d8-b616-4dda-b9c9-6412507fc28d

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-7be0c1b7-49b9.cloud.databricks.com
    variables:
      catalog: energy_UC
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-7be0c1b7-49b9.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/alexjimgar2003@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/alexjimgar2003@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: energy_UC
      schema: prod
    permissions:
      - user_name: alexjimgar2003@gmail.com
        level: CAN_MANAGE
